name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (no data)
        run: python -m pytest -q tests/test_core.py
      - name: Download SKAB
        run: python -c "from lineguard.data import download_skab; download_skab()"
      - name: Data and API tests
        run: python -m pytest -q tests/test_data.py tests/test_service.py
