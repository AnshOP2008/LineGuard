[project]
name = "lineguard"
version = "1.0.0"
description = "Detect machine faults from multi-sensor data, tell sensor faults from machine faults, and show what a fault means for the production line."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "lightgbm>=4.3", "scipy>=1.11", "simpy>=4.1",
  "requests>=2.31", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "paho-mqtt>=2.0",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["lineguard", "lineguard.detectors", "service"]

[tool.ruff]
line-length = 120
